# Build with Node, then upload dist/ to Azure Static Web Apps (M10).
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN (see docs/DEPLOY.md).
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      # Empty until the Azure resource exists (docs/DEPLOY.md); then the build is still checked but not uploaded.
      AZURE_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Skip upload (no Azure token yet)
        if: env.AZURE_TOKEN == ''
        run: echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set — build checked, nothing deployed. See docs/DEPLOY.md."

      - name: Upload to Azure Static Web Apps
        if: env.AZURE_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # comments preview URLs on pull requests
          action: upload
          app_location: dist # already built above
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the pull request preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
